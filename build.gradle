plugins {
    id 'net.neoforged.moddev' version '2.0.80'
}

repositories {
    maven { url = 'https://maven.createmod.net' }
    maven { url = 'https://maven.ithundxr.dev/snapshots' }
}

dependencies {
    // Development runtime only; none of these artifacts are bundled into the Arcadia patch JAR.
    runtimeOnly("com.simibubi.create:create-${minecraft_version}:${create_version}-281:slim") {
        transitive = false
    }
    runtimeOnly('com.tterrag.registrate:Registrate:MC1.21-1.3.0+67')
    runtimeOnly("net.createmod.ponder:ponder-neoforge:1.0.82+mc${minecraft_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:1.0.6")
    runtimeOnly("dev.engine-room.vanillin:vanillin-neoforge-${minecraft_version}:1.1.3-41")
}

version = "${mod_version}"
group = "${mod_group}"

base {
    archivesName = mod_id.replace('_', '-')
}

neoForge {
    version = "${neo_version}"
    runs {
        server {
            server()
            gameDirectory = file('run/server')
            programArgument '--nogui'
        }
    }
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.named('processResources') {
    def replaceProperties = [
        mod_id                : mod_id,
        mod_name              : mod_name,
        mod_version           : mod_version,
        mod_license           : mod_license,
        mod_authors           : mod_authors,
        mod_description       : mod_description,
        mod_repo_url          : mod_repo_url,
        mod_issue_tracker_url : mod_issue_tracker_url,
        neo_version           : neo_version,
        create_version        : create_version,
    ]
    inputs.properties(replaceProperties)
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand(replaceProperties)
    }
}

tasks.named('jar') {
    manifest {
        attributes([
            'MixinConfigs': 'arcadia_patch_create.mixins.json'
        ])
    }
}
